# Agent Tasks tracker — что делает АГЕНТ (в отличие от Owner Decisions = что нужно от владельца).
# Чтобы владелец видел в Nimbalyst: что в бэклоге, что в работе, что готово. Источник правды — эти
# markdown-карточки в git (nimbalyst-local/tracker/agent-*.md). Nimbalyst рендерит как kanban.
type: agent-task
displayName: Agent Task
displayNamePlural: Agent Tasks
icon: robot
color: "#0891b2"

modes:
  inline: false
  fullDocument: true

idPrefix: agent
idFormat: ulid

fields:
  - name: title
    type: string
    required: true
  - name: status
    type: select
    default: backlog
    options:
      # category — родной признак Nimbalyst: фильтр Open прячет `done`-категорию (17.09: без неё
      # `ingested` считался открытым и 217 закрытых решений стояли на доске владельца).
      - value: new
        label: New
        category: unstarted
      - value: backlog
        label: Backlog
        category: unstarted
      - value: in-progress
        label: In Progress
        category: started
      - value: blocked
        label: Blocked (ждёт владельца)
        category: started
      - value: done
        label: Done
        category: done
      - value: ingested
        label: Ingested
        category: done
  - name: source
    type: string
    required: false
