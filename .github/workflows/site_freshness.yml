# Site Custodian block 2 (ADR-YL-011) — independent freshness/consistency monitor.
# Runs OUTSIDE the deploy pipeline every 6h: fetches the live site + live API + repo snapshot and
# asserts the triple agrees, is fresh (<=30h), is available, and never OVERSTATES a metric. Any FAIL
# alerts via Telegram (secrets) AND turns this job red (a second, built-in alert channel). The kill-rule
# (OVERSTATED, or staleness>48h two runs) flips the site to degraded — that push needs the PAT secret.
name: site-freshness

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ОПУБЛИКОВАННАЯ ВИТРИНА — ВХОД ХАРНЕССА, а не догадка сторожа (ADR-788).
      #
      # `cadence.read_published()` (ADR-630) ищет опубликованную витрину по МЕСТУ:
      # явный путь → `$SPA_PUBLISHED_SHELF` → зеркало origin `~/Documents/SPA_mirror`
      # (ADR-152). В облаке зеркала нет и быть не может, поэтому такт честно отвечал
      # «НЕ ИЗМЕРЕНО» — и это верный отказ (инв. #17), но отвечал он на вопрос
      # окружения, а не сайта. Замер цикла #910: с 07.10 `SHELF_OVERDUE` —
      # ЕДИНСТВЕННАЯ причина красного в 9 разобранных прогонах из 9, job красен 68
      # прогонов подряд (последний зелёный 2026-10-03T05:12Z), и владельцу ушло 68
      # тревог об окружении. Цена не в шуме: `OVERSTATED_METRIC` сделал бы job ровно
      # таким же красным, и 69-я тревога была бы неотличима от предыдущих 68.
      #
      # Лечить это понижением проверки нельзя (инв. #16) и не нужно: тот же порядок,
      # что у `fetch-depth: 0` в `.claude/rules/deployment.md` — предпосылку объявляет
      # ДЖОБА. Операнд берётся не из рабочего дерева (на другой ветке `workflow_dispatch`
      # оно НЕ опубликовано — ровно та подмена, которую запрещает `cadence.py`), а
      # из `origin/main`: это и есть копия, которую строит Cloudflare Pages.
      #
      # Отказ fail-soft НАМЕРЕННО: не достав операнд, шаг печатает причину и НЕ
      # выставляет переменную — монитор отработает и скажет «НЕ ИЗМЕРЕНО» сам. Жёсткий
      # выход снял бы с прогона `OVERSTATED_METRIC`, то есть самую критичную проверку,
      # из-за недоступности git — цена больше находки.
      - name: Resolve the PUBLISHED shelf (origin/main) — harness input, ADR-788
        run: |
          # Имя ref'а СВОЁ (`refs/spa/published`), а не FETCH_HEAD и не
          # `refs/remotes/origin/main`: первый зависит от того, что подтянул соседний
          # шаг, второй уже выставлен `actions/checkout` для ТЕКУЩЕЙ ветки. Операнд
          # обязан называться однозначно, иначе «опубликованная витрина» снова станет
          # тем, что окажется под рукой.
          set +e
          git fetch --depth=1 origin +refs/heads/main:refs/spa/published 2>/tmp/shelf.err
          mkdir -p "$RUNNER_TEMP/published"
          git show refs/spa/published:landing/src/data/site_numbers.json > "$RUNNER_TEMP/published/site_numbers.json" 2>>/tmp/shelf.err
          code=$?
          set -e
          if [ "$code" != "0" ] || [ ! -s "$RUNNER_TEMP/published/site_numbers.json" ]; then
            echo "::warning::published shelf NOT resolved from origin/main (git exit=$code): $(cat /tmp/shelf.err 2>/dev/null | head -2)"
            echo "::warning::\$SPA_PUBLISHED_SHELF остаётся НЕ объявленной — монитор назовёт такт 'НЕ ИЗМЕРЕНО' сам (инв. #17)"
            exit 0
          fi
          echo "SPA_PUBLISHED_SHELF=$RUNNER_TEMP/published/site_numbers.json" >> "$GITHUB_ENV"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print('published shelf resolved: measured_at=%s published_at=%s next_publication=%s' % (d.get('measured_at'), d.get('published_at'), d.get('next_publication')))" "$RUNNER_TEMP/published/site_numbers.json"
      - name: Run Site Custodian freshness monitor
        env:
          TELEGRAM_BOT_TOKEN_SPA: ${{ secrets.TELEGRAM_BOT_TOKEN_SPA }}
          TELEGRAM_CHAT_ID_SPA: ${{ secrets.TELEGRAM_CHAT_ID_SPA }}
          GITHUB_PAT_SPA: ${{ secrets.SPA_PAT }}
        run: |
          python scripts/site_freshness_monitor.py
      - name: Funnel link-integrity tripwire (advisory)
        # if: always() — иначе красный шаг выше СНИМАЕТ эту проверку с прогона. С 14.08
        # (цикл #228) монитор краснеет и на недоставке таблички честности: для ветки
        # восстановления это единственный оставшийся канал (звонить владельцу ей запрещено),
        # и он не имеет права заодно выключать соседнюю проверку. Два независимых сторожа в
        # одном job'е обязаны отвечать каждый за себя.
        if: always()
        # Activates the previously-orphaned scripts/funnel_link_check.py: crawls the live
        # conversion path (entry -> checkup -> packages -> pilot, both domains) and fails ONLY on a
        # real broken link (exit 1). A transient network failure (exit 2) is a warning, never a red
        # herring. Read-only/advisory -- never mutates the site. Isolated from the fail-closed monitor
        # above so it can never affect the degraded-snapshot kill-rule.
        run: |
          set +e
          python scripts/funnel_link_check.py
          code=$?
          set -e
          if [ "$code" = "1" ]; then echo "::error::broken link in conversion funnel (funnel_link_check exit 1)"; exit 1; fi
          if [ "$code" = "2" ]; then echo "::warning::funnel_link_check could not verify (network/transient) -- not failing"; fi
          echo "funnel_link_check exit=$code"
      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-freshness-report
          path: data/site_freshness_report.json
          if-no-files-found: ignore
