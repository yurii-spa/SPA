# Сторож живости CI на PR (ADR-145).
#
# Отвечает на вопрос, который не задавал НИКТО: «а прогон-то вообще БЫЛ?»
#
# Авария 2026-08-26 (PR #46): событие `pull_request` не создало ни одного прогона Actions.
# Не «прогон упал» — прогона не было вовсе. На странице PR стояла зелёная галочка стороннего
# деплоя, и PR выглядел проверенным. «Не измерено» стало неотличимо от «прошло» — и неотличимо
# в успокаивающую сторону.
#
# ВХОД — `schedule`, И ЭТО СУТЬ. Сторож, живущий на том же событии, которое он сторожит, не
# способен увидеть, что событие не сработало: не запустился CI — не запустился и он. Ровно та
# ошибка, за которую проект уже платил (`.claude/rules/deployment.md`, «четыре вопроса — четыре
# разных сторожа»). Поэтому вход независимый.
#
# Сторож НАЗЫВАЕТ: он ничего не запускает и не чинит. Красный job = у какого-то открытого PR
# head без прогонов.
name: pr-ci-liveness

on:
  schedule:
    - cron: "25 * * * *"   # ежечасно; PR живут часами, сутки ожидания обесценили бы проверку
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr-ci-liveness
  cancel-in-progress: false

jobs:
  liveness:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Код возврата разделяет ТРИ исхода (инв. #17): 0 — прогоны есть · 1 — есть PR без
      # прогонов · 2 — НЕ ИЗМЕРЕНО (нет токена, сеть, отказ API). Третий не выдаётся за
      # успех: молчание сторожа обязано отличаться от его одобрения, поэтому job краснеет
      # и на 1, и на 2, но текст называет, что именно из двух произошло.
      - name: У каждого открытого PR обязан быть прогон Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_pr_ci_runs.py --repo "${{ github.repository }}"
