name: SPA Tests

on:
  schedule:
    - cron: "10 4 * * *"   # гарантированный суточный вердикт: прогон по расписанию в группу пушей не попадает и не отменяется
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
      - 'AUTOPUSH_REPORT_*'
      - 'scripts/archive/**'
      - 'scripts/push_*.sh'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
      - 'AUTOPUSH_REPORT_*'
      - 'scripts/archive/**'
      - 'scripts/push_*.sh'
  workflow_dispatch:

# ── Очередь Actions была ЗАПЕРТА САМА СОБОЙ (замер 12.09) ────────────────────────────
# Замер: 14 прогонов в работе, **166 в очереди**, каждый тяжёлый идёт 1,5–4 часа. Пуш
# добавляет пять прогонов, а разгружается очередь медленнее, чем растёт, — поэтому вердикт
# о ВЕРШИНЕ main не приходил вовсе, и шаги «scripts/ gate tests» и «Pre-deploy checks»
# не исполнялись неделями (они ПРОПУСКАЮТСЯ после падения шага 2, а до них очередь просто
# не доходила). Группа схлопывает устаревшие прогоны одной ветки: важен вердикт о вершине,
# а очередь из 166 не отвечает ни на один вопрос.
#
# Отмена включена ТОЛЬКО для пушей. Ключ группы содержит `event_name`, поэтому ручной и
# расписанный прогоны в эту группу не попадают и не отменяются никогда: при непрерывной
# автономной работе одна лишь отмена сменила бы молчание очереди на молчание отмен, и
# суточный прогон — тот, что гарантированно доводится до конца, — часть этого же решения.
concurrency:
  group: spa-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      # fail-fast: false — тот же класс, что ADR-474, но на уровне МАТРИЦЫ. По умолчанию
      # падение одной версии Python ОТМЕНЯЕТ вторую, и её вердикт становится не красным,
      # а отсутствующим: в прогоне 36119204905 джоба 3.12 значится `cancelled`, то есть
      # про 3.12 мы в тот день не узнали НИЧЕГО. Отмена здесь не экономит очередь —
      # устаревшие прогоны одной ветки схлопывает `concurrency` выше, — а лишь стирает
      # половину замера. Джоба по-прежнему падает от любого красного шага.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-pytest
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pytest-timeout pyyaml argon2-cffi eth-account fastapi pydantic httpx requests web3 numpy pandas python-multipart uvicorn bcrypt pyjwt pyflakes mypy==2.1.0  # option-A full test-dep set (runtime stays stdlib-only). pytest-timeout = a per-test wedge backstop so a hung test fails-fast + NAMED, never wedging the runner 30min. pyflakes = the unused-import ratchet in scripts/tests/ shells out to it (цикл #74). mypy = the type gate that tests/test_mypy_gate.py shells out to; ОБЯЗАТЕЛЬНА, иначе гейт красный, а не пропущенный (цикл #107, инв. #2) — версия пиннится так же, как в ci-lite.yml.

      # --- Deterministic test execution (Architect N11) ---------------------
      # Two CI runs MUST produce an IDENTICAL collection order + pass/fail set
      # so any flake in the ~99k shared-state suite is reproducible (this suite
      # gates go-live evidence).
      #   * PYTHONHASHSEED=0   — fixes dict/set iteration order so tests that
      #                          (incorrectly) depend on hash ordering are stable.
      #   * -p no:randomly     — hard-disables pytest-randomly IF it is ever
      #                          installed (transitive dep / future add). With
      #                          the plugin absent it is a harmless no-op, so
      #                          collection stays in stable filesystem order.
      # Do NOT remove these flags without re-proving reproducibility.
      - name: Run integration tests
        run: |
          python -m pytest tests/ -v --tb=short -p no:randomly \
            --junitxml=reports/junit-tests.xml
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      # Вердикт о ШАГЕ, а не о джобе: у Actions два состояния (success/failure), а
      # исходов три (ADR-474). Читает СОБСТВЕННУЮ запись прогона; нет записи ⇒ сессия
      # не дошла до конца ⇒ «НЕ ИЗМЕРЕНО» названо словом, а не спрятано в `failure`.
      # Условие обязательно: после падения шага вердикт нужен ИМЕННО тогда. И именно
      # `!cancelled()`, а НЕ `always()`: шаги с `always()` исполняются и при ОТМЕНЕ джобы,
      # то есть вытесненный пуш доигрывал бы 120-минутный прогон и `cancel-in-progress`
      # выше перестал бы разгружать очередь (та самая очередь из 166, замер 12.09).
      # Держит spa_core/tests/test_pytest_timeout_method_reports.py.
      # Шаг `tests/` намеренно идёт БЕЗ `--timeout`: своего порога у него никогда не
      # было, а ставить его вслепую значит рисковать покрасить зелёный набор.
      - name: Verdict — tests/
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_verdict.py reports/junit-tests.xml --label 'tests/'

      # NOTE (цикл #694, 2026-09-25, ADR-474): здесь стояло `--timeout-method=thread`, и
      # ЭТОТ шаг месяц не падал, а ОБРЫВАЛСЯ. `thread` не «валит тест» — таймер печатает
      # стек всех потоков и зовёт `os._exit(1)`, то есть убивает СЕССИЮ: сводки pytest в
      # логе не появляется ни одной. Замер прогона 36119204905 (`f1f813226`): прогресс
      # доехал до `[ 10%]` за 1732 с, из 106 810 собранных тестов ≈96 000 не получили
      # никакого вердикта, а шаг доложил `failure` — «не измерено» под видом «красное»
      # (инв. #17). `signal` (SIGALRM) поднимает исключение В ТЕСТЕ: виновник НАЗЫВАЕТСЯ,
      # сессия доходит до конца и печатает сводку. Ровно то, что уже объявлено намерением
      # в комментарии к `pip install` выше: «fails-fast + NAMED».
      # Дифференциальный контроль на живом pytest — spa_core/tests/test_pytest_timeout_method_reports.py.
      # ⚠️ `signal` не прерывает блокировку в C-коде, которая не возвращается в интерпретатор
      # (замер #59: `_ssl__SSLSocket_read` в test_dfb_risk_overlay.py). Против ЭТОГО класса
      # здесь стоит внешняя граница `timeout-minutes` — она бьёт по джобе, а не по тесту,
      # и её исход тоже читается как «НЕ ИЗМЕРЕНО», а не как «красно».
      # ⚠️ 120 мин — ГРАНИЦА ЗАВИСАНИЯ, а не бюджет работы: сколько идёт полный шаг на
      # раннере, НЕ ИЗМЕРЕНО ни разу с 26.08 (последний известный полный замер — 1004 с,
      # журнал W31; сегодняшние 10 % стоили 1732 с). Поднимать её, если вердикт скажет
      # «НЕ ИЗМЕРЕНО: сессия не дошла до конца», — законно; молча ронять до «покрасить
      # зелёным» — запрещено (инв. #16).
      # NOTE (цикл #46, 2026-07-30): отсюда убран
      # `--ignore=spa_core/tests/test_golive_checker.py` — 43 теста гейта go-live не
      # выполнялись в CI ни разу с 2026-07-17, причина исключения нигде не записана.
      # Возврат подтверждён реальным прогоном Actions (+43 passed ровно, 3.11 и 3.12).
      # Новые сужения набора тестов гейтит spa_core/tests/test_ci_test_exclusions.py.
      # NOTE (цикл #697, 2026-09-25): 120 → 240. Граница поднята НЕ чтобы покрасить шаг
      # зелёным, а потому, что её впервые есть чем назвать. Замер — прогон 36174140955:
      # шаг шёл 120 мин РОВНО (18:41:49 → 20:42:01) и был снят на `[ 80%]`. Это первая
      # точка длительности с 26.08, и она говорит одно: в прежнюю границу шаг не
      # помещается ПО ПОСТРОЕНИЮ. Сам воркфлоу разрешал этот шаг заранее — «поднимать
      # её, если вердикт скажет „НЕ ИЗМЕРЕНО: сессия не дошла до конца“, — законно;
      # молча ронять до „покрасить зелёным“ — запрещено» (инв. #16), — и вердикт сказал
      # ровно это.
      # ПОЧЕМУ 240, А НЕ 142. Линейная экстраполяция даёт 114 / 0,8 = 142 мин, и брать
      # её значило бы подставить ОДНО окно вместо другого — ровно то, что нашёл ADR-473.
      # Поэтому здесь не экстраполяция, а ВЕРХНЯЯ ГРАНИЦА: даже если оставшиеся 20 %
      # стоят столько же, сколько все первые 80 % (нарочито пессимистично), это 228 мин
      # < 240. Остальные шаги джобы — `tests/` ~10 мин, `scripts/` ~1, pre-deploy ~5 —
      # оставляют джобу внутри 6-часового предела Actions.
      # ⚠️ 240 — по-прежнему ГРАНИЦА ЗАВИСАНИЯ, а не бюджет. Настоящую длительность шага
      # измерит первый ДОШЕДШИЙ прогон, и до него она остаётся НЕ ИЗМЕРЕННОЙ.
      # Порог `--timeout=180` на ТЕСТ не тронут: это другой вопрос (инв. #16).
      # NOTE (цикл #697): `-p spa_core.ci.pytest_stream_record` + SPA_PYTEST_STREAM.
      # Клин снимает сессию ДО того, как pytest напишет сводку и junit-запись, поэтому
      # тот же прогон показал `FFF F..F....F.F..F` на 80 % — тринадцать упавших, чьих
      # ИМЁН не существует нигде, — и шесть минут полной тишины перед топором (блокировка
      # в C-коде, которую SIGALRM не прерывает). Потоковая запись кладёт имя теста на диск
      # ДО того, как он побежал, поэтому «начался и не кончился» становится наблюдаемым.
      # Вердикта она не выносит: код возврата по-прежнему берётся у junit-записи.
      - name: Run spa_core unit tests
        if: ${{ !cancelled() }}
        timeout-minutes: 240
        run: |
          python -m pytest spa_core/tests/ -q --tb=short -p no:randomly \
            -p spa_core.ci.pytest_stream_record \
            --timeout=180 --timeout-method=signal \
            --junitxml=reports/junit-spa_core.xml
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'
          SPA_PYTEST_STREAM: reports/stream-spa_core.jsonl

      - name: Verdict — spa_core/tests/
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_verdict.py reports/junit-spa_core.xml --label 'spa_core/tests/' --stream reports/stream-spa_core.jsonl

      # NOTE (цикл #74, 2026-08-01): каталог `scripts/tests/` добавлен в CI впервые —
      # до этого он не запускался НИ ОДНИМ workflow, то есть 191 тест (репетиция
      # стоп-крана, страж инварианта #3 «LLM запрещён», гейт деплоя агентов инв. #12,
      # преflight go-live и сам ратчет неиспользуемых импортов) не выполнялся никогда.
      # Это тот же класс, что цикл #46, но другим механизмом: там тесты выключали
      # `--ignore`, здесь их просто ни разу не включали, поэтому гейт #46
      # (spa_core/tests/test_ci_test_exclusions.py) их не видел по построению.
      # Рецидив КЛАССА гейтит spa_core/tests/test_ci_covers_every_test_dir.py.
      # Карточка: agent-ci-never-runs-scripts-tests-dir.
      # Тем же измерением нашлись ещё два невидимых каталога — оба ЗЕЛЁНЫЕ и быстрые:
      # spa_core/analytics/gross_of/ (295 тестов, 0.2с) и research/cards/ (7).
      # NOTE (цикл #694, ADR-474): условие на трёх шагах ниже — про ту же слепоту
      # с другой стороны. Обрыв ОДНОГО шага пропускал все следующие, поэтому «scripts/
      # gate tests» и «Pre-deploy checks» не исполнялись неделями и их вердикт был не
      # красным, а ОТСУТСТВУЮЩИМ. Джоба по-прежнему падает от любого красного шага —
      # гейт не ослаблен; изменилось только то, что теперь измеряются ВСЕ шаги, а не
      # те, что стоят до первого обрыва.
      - name: Run scripts/ gate tests + colocated suites
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          python -m pytest scripts/tests/ spa_core/analytics/gross_of/ research/cards/ \
            -q --tb=short -p no:randomly -p spa_core.ci.pytest_stream_record \
            --timeout=180 --timeout-method=signal \
            --junitxml=reports/junit-scripts.xml
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'
          SPA_PYTEST_STREAM: reports/stream-scripts.jsonl

      - name: Verdict — scripts/tests/ + colocated
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_verdict.py reports/junit-scripts.xml --label 'scripts/tests/ + colocated' --stream reports/stream-scripts.jsonl

      - name: Pre-deploy checks (dry run)
        if: ${{ !cancelled() }}
        run: python3 scripts/pre_deploy_check.py
        env:
          SPA_ENV: ci

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check forbidden imports (risk/execution domains)
        run: |
          python3 -c "
          import ast, os, sys
          forbidden = ['anthropic', 'openai', 'langchain', 'numpy', 'pandas']
          errors = []
          for domain in ['spa_core/risk', 'spa_core/execution']:
              for root, dirs, files in os.walk(domain):
                  for f in files:
                      if f.endswith('.py'):
                          src = open(os.path.join(root, f)).read()
                          for lib in forbidden:
                              if f'import {lib}' in src or f'from {lib}' in src:
                                  errors.append(f'{os.path.join(root, f)}: forbidden import {lib}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Import check PASS')
          "

      - name: Stdlib contract guard
        run: python3 scripts/stdlib_contract_guard.py

      - name: KANBAN health check
        run: python3 scripts/kanban_health.py --check-only
