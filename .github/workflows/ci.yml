name: SPA CI

on:
  schedule:
    - cron: "40 3 * * *"   # гарантированный суточный вердикт: прогон по расписанию в группу пушей не попадает и не отменяется
  workflow_dispatch:   # allow manual/official green-confirmation runs
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
      - 'AUTOPUSH_REPORT_*'
      - 'scripts/archive/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
      - 'AUTOPUSH_REPORT_*'
      - 'scripts/archive/**'

# ── Очередь Actions была ЗАПЕРТА САМА СОБОЙ (замер 12.09) ────────────────────────────
# Замер: 14 прогонов в работе, **166 в очереди**, каждый тяжёлый идёт 1,5–4 часа. Пуш
# добавляет пять прогонов, а разгружается очередь медленнее, чем растёт, — поэтому вердикт
# о ВЕРШИНЕ main не приходил вовсе, и шаги «scripts/ gate tests» и «Pre-deploy checks»
# не исполнялись неделями (они ПРОПУСКАЮТСЯ после падения шага 2, а до них очередь просто
# не доходила). Группа схлопывает устаревшие прогоны одной ветки: важен вердикт о вершине,
# а очередь из 166 не отвечает ни на один вопрос.
#
# Отмена включена ТОЛЬКО для пушей. Ключ группы содержит `event_name`, поэтому ручной и
# расписанный прогоны в эту группу не попадают и не отменяются никогда: при непрерывной
# автономной работе одна лишь отмена сменила бы молчание очереди на молчание отмен, и
# суточный прогон — тот, что гарантированно доводится до конца, — часть этого же решения.
concurrency:
  group: spa-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pyyaml argon2-cffi eth-account fastapi pydantic httpx requests web3 numpy pandas python-multipart uvicorn bcrypt pyjwt pyflakes mypy==2.1.0  # option-A full test-dep set (runtime stays stdlib-only). pyflakes = the unused-import ratchet in scripts/tests/ shells out to it (цикл #74). mypy = the type gate that tests/test_mypy_gate.py shells out to; ОБЯЗАТЕЛЬНА, иначе гейт красный, а не пропущенный (цикл #107, инв. #2) — версия пиннится так же, как в ci-lite.yml.

      - name: Smoke test — import spa_core
        run: |
          python3 -c "
          from spa_core.base import BaseAnalytics, BaseReport, BaseAdapter
          from spa_core.utils.kanban import increment_done
          import spa_core
          print('spa_core imports OK')
          "
        env:
          SPA_ENV: ci

      # --- Deterministic test execution (Architect N11) ---------------------
      # Reproducible order/seed so flakes in the shared-state suite (which gates
      # go-live evidence) are reproducible across two consecutive CI runs:
      #   PYTHONHASHSEED=0  fixes dict/set iteration order;
      #   -p no:randomly    disables pytest-randomly if ever installed (no-op
      #                     when absent → stable filesystem collection order).
      # Do NOT remove without re-proving identical collection order.
      #
      # NOTE (цикл #46, 2026-07-30): из ОБОИХ шагов ниже убран
      # `--ignore=tests/test_golive_checker.py`. Он приехал 2026-07-17 вместе с самим
      # файлом workflow, без записанной причины, и безобидным дублем не был: под
      # `cd spa_core` он реально выключал все 43 теста гейта go-live (источник
      # публичного «29/29 READY»), а в шаге от корня такого пути нет вовсе — pytest
      # принимает несуществующий `--ignore` МОЛЧА (exit 0), поэтому мёртвый флаг
      # ничем себя не выдавал. Возврат тестов проверен реальным прогоном Actions
      # (+43 passed ровно, py3.11 и py3.12). Новые сужения набора тестов гейтит
      # spa_core/tests/test_ci_test_exclusions.py — карточка agent-ci-ignores-golive-gate-tests.
      - name: Run spa_core/tests (unit)
        run: |
          cd spa_core
          python -m pytest tests/ -q --tb=short -p no:randomly
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      # Мета-проверка (WS-6.3): доказывает, что тесты money-path ПОЙМАЮТ настоящую
      # регрессию. Обычные наборы показывают, что код верен на пробованных входах;
      # этот гейт ломает money-path нарочно и требует, чтобы тесты покраснели.
      #
      # Подключён 2026-08-09. До этого не запускался НИГДЕ: ни агента, ни шага в CI,
      # ни артефакта — при том что 92 секунды и детерминирован. То есть самая
      # доказательная проверка в наборе существовала и молчала (класс «код есть,
      # никто не зовёт», восьмой случай за две недели).
      #
      # Замер при подключении: 14 мутантов, 14 убито, 0 выживших.
      # Красный этот шаг означает: money-path можно сломать, и тесты этого не заметят.
      - name: Mutation gate (money-path meta-check)
        run: python scripts/mutation_gate.py
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      - name: Run tests/ root (integration)
        run: |
          python -m pytest tests/ -q --tb=short -x -p no:randomly
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      # NOTE (цикл #74, 2026-08-01): каталог `scripts/tests/` добавлен в CI впервые —
      # до этого его не запускал НИ ОДИН workflow, т.е. 191 тест (репетиция стоп-крана,
      # страж инварианта #3, гейт деплоя агентов инв. #12, преflight go-live и сам ратчет
      # неиспользуемых импортов) не выполнялся никогда. Класс тот же, что у цикла #46,
      # механизм другой: там тесты выключали `--ignore`, здесь их ни разу не включали,
      # поэтому гейт #46 (test_ci_test_exclusions.py) их не видел по построению.
      # Рецидив КЛАССА гейтит spa_core/tests/test_ci_covers_every_test_dir.py.
      # Карточка: agent-ci-never-runs-scripts-tests-dir.
      # Тем же измерением нашлись ещё два невидимых каталога — оба ЗЕЛЁНЫЕ и быстрые:
      # spa_core/analytics/gross_of/ (295 тестов, 0.2с) и research/cards/ (7).
      - name: Run scripts/ gate tests + colocated suites
        run: |
          python -m pytest scripts/tests/ spa_core/analytics/gross_of/ research/cards/ \
            -q --tb=short -p no:randomly
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      # --- Перепись дверей доставки (ADR-352) ---------------------------------
      # Спрашивает ОДНО: не появилось ли двери, которая пишет в origin, не зовёт
      # стража перезаписи И при этом кем-то запускается. Совпадение трёх осей —
      # код 1. Дверь без запускающего находкой не является (пустой набор — замер,
      # а не «мёртвая»), неразобранный файл — код 2 «НЕ ИЗМЕРЕНО», и он тоже
      # красный: «не измерено» никогда не выдаётся за «чисто» (инвариант #17).
      - name: Delivery-door census (ADR-352)
        run: python scripts/push_door_census.py --root .
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      # --- git path-coordinate census (ADR-354) --------------------------------
      # git разбирает `<ревизия>:<путь>` ОТ КОРНЯ рабочей копии, а pathspec — ОТ
      # ТЕКУЩЕГО КАТАЛОГА. Один зов может нести обе координаты, и тогда каталог
      # запуска молча делает половину зова неверной (авария #574: перечисление
      # предков возвращало ПУСТО, и ноль печатался как «посмотрели и не нашли»).
      # Перепись мерит НАСЕЛЕНИЕ класса и слепоту НАБЛЮДЕНИЕМ — прогоняя каждую
      # форму из корня и из подкаталога одной копии. Код 3 — находка, код 2 —
      # «НЕ ИЗМЕРЕНО», и он тоже красный (инвариант #17). Единица оставлена
      # CPython: крах прибора не смеет выглядеть его находкой (ADR-347).
      - name: git path-coordinate census (ADR-354)
        run: python scripts/git_path_coordinate_census.py --root .
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      # То же самое про SHELL-часть, названную ADR-354 вне замера (183 скрипта —
      # AST их не разбирает, и это НЕ «у них чисто»). В shell каталог задаётся не
      # параметром, а СОСТОЯНИЕМ, поэтому перепись идёт по ИСТОЧНИКУ каталога
      # (сам · plist · обёртка · не задан ничем), а единица учёта — ЗОВ, не файл.
      # Код 3 — находка, код 2 — «НЕ ИЗМЕРЕНО», и он тоже красный (инвариант #17).
      - name: shell git cwd census (ADR-355)
        run: python scripts/shell_git_cwd_census.py --root .
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      # --- КУДА ведёт доказанный `cd` (ADR-356) --------------------------------
      # ADR-355 доказал, что `cd` исполняется, и ни разу не спросил, куда он
      # ведёт. «Каталог задан» и «каталог тот самый» — разные утверждения.
      # Предмет — зовы, чей каталог задаёт ОКРУЖЕНИЕ (`${VAR:-$HOME/...}`):
      # у переменной есть умолчание, а каталог при этом НЕ известен. База
      # заморожена и может только уменьшаться; дописывать в неё запрещено.
      - name: shell git cd-target census (ADR-356)
        run: python scripts/shell_git_cd_target_census.py --root . --baseline scripts/shell_git_cd_target_baseline.json
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      # --- ТОТ ЛИ это репозиторий (ADR-360) ------------------------------------
      # ADR-356 доказал, что каталог есть КОРЕНЬ рабочей копии, и на этом принял
      # на веру, что это корень ТОГО САМОГО репозитория. Личность объявлена
      # ЗАРАНЕЕ как ПЕРЕСЕЧЕНИЕ ИСТОРИЙ; `remote get-url origin` — конфиг, а
      # корневой коммит — функция глубины клона, и оба отведены замером.
      # Заводится здесь циклом #582: #579 оставил прибор без вызывающего
      # НАМЕРЕННО, и цена этого решения измерена — `test_unwired_scripts_ratchet`
      # покраснел на `shell_git_cd_repo_identity` и остался красным на main.
      - name: shell git repo-identity census (ADR-360)
        run: python scripts/shell_git_cd_repo_identity.py --root . --baseline scripts/shell_git_cd_repo_identity_baseline.json
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      # --- ССЫЛКА: кэш или вопрос к серверу (ADR-361) --------------------------
      # Цепь 355/356/360 отвечала, ГДЕ исполняется зов, и ни разу — ЧТО означает
      # ссылка, которую он называет. `origin/main` есть КЭШ последнего `fetch`:
      # значение без возраста и без провенанса (замер по reflog прод-дерева —
      # максимум 224.5 ч). Предмет базы — только ось СВЕЖЕСТИ: `fetch`, чей отказ
      # ничего не прекращает, оставляет мутирующему зову кэш. База может только
      # уменьшаться. Код 3 — предмет вырос, код 2 — «НЕ ИЗМЕРЕНО» (тоже красный).
      - name: shell git ref provenance (ADR-361)
        run: python scripts/shell_git_ref_provenance.py --root . --baseline scripts/shell_git_ref_provenance_baseline.json
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      # --- Pre-cutover readiness gate (ADVISORY, non-blocking) ----------------
      # Drives a cycle through EACH money-path failure mode against an ephemeral
      # SANDBOX and asserts every defense fires (HARD/SOFT kill, DL-01/DL-02,
      # RiskPolicy, analytics, Base-gas, NAV-reconcile, position-monitor,
      # fail-safe HOLD, inert live-gate). INERT / sandbox-only / never imports
      # execution/. `continue-on-error: true` → ADVISORY: it never gates the
      # push and never flips is_live; the LiveTradingGate stays the master block.
      # Doc: docs/PRE_CUTOVER_GATE.md.
      - name: Pre-cutover readiness gate (advisory)
        continue-on-error: true
        run: python3 scripts/pre_cutover_gate.py
        env:
          SPA_ENV: ci
          PYTHONHASHSEED: '0'

      - name: Presentation-vs-SSOT guard (Law 3)
        run: python3 scripts/check_presentation_ssot.py
        env:
          SPA_ENV: ci

      - name: Strategy-as-config change-control guard
        run: python3 scripts/check_strategy_configs.py
        env:
          SPA_ENV: ci

      - name: Site redirect-shadowing guard (no _redirects rule may shadow a real page)
        run: python3 scripts/check_redirect_shadowing.py

      - name: Tier-1 module smoke
        run: |
          python3 -c "import spa_core.backtesting.tier1.evaluator, spa_core.backtesting.tier1.gate, spa_core.backtesting.tier1.nav_proof, spa_core.governance.policy, spa_core.governance.ssot, spa_core.execution.readiness_audit, spa_core.audit.hash_chain"
        env:
          SPA_ENV: ci

      - name: LLM-forbidden guard (risk/execution/monitoring/allocator/adapters)
        run: python3 scripts/lint_llm_forbidden.py
        env:
          SPA_ENV: ci

      - name: Check for forbidden imports
        run: |
          # CI lint: запрещённые импорты в spa_core/risk, spa_core/execution
          python3 -c "
          import ast, os, sys
          forbidden = ['anthropic', 'openai', 'langchain', 'numpy', 'pandas']
          errors = []
          for domain in ['spa_core/risk', 'spa_core/execution']:
            for root, dirs, files in os.walk(domain):
              for f in files:
                  if f.endswith('.py'):
                      src = open(os.path.join(root, f)).read()
                      for lib in forbidden:
                          if f'import {lib}' in src or f'from {lib}' in src:
                              errors.append(f'{os.path.join(root, f)}: forbidden import {lib}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Import check PASS')
          "

      - name: KANBAN Health Check
        run: python3 scripts/kanban_health.py --check-only

      - name: SPAError Adoption Check
        run: python3 scripts/spaerror_final_audit.py 2>/dev/null || true

      - name: Stdlib Contract Guard
        run: python3 scripts/stdlib_contract_guard.py
