# Проводка двух генераторов, у которых иначе нет вызывающего.
#
# Храповик `spa_core/tests/test_unwired_scripts_ratchet.py` поймал их при рождении
# и был прав: скрипт с точкой входа, которого никто не зовёт, — это ровно L3 из
# самого реестра («код есть, но по-настоящему не работает»). Дописать имя в базу
# храповика, чтобы погасить падение, запрещено — поэтому они подключены СЮДА, и
# обе проверки настоящие: каждая умеет покраснеть.
#
#   · реестр зрелости — краснеет, если функция с замером L2 записана как построенная;
#   · паспорта агентов — краснеют, если манифест отстал от источников (кто-то
#     дописал docstring модулю или докурировал produces, а паспорт не обновили).
#
# Обе читают репозиторий и НИЧЕГО не пишут: режим `--check`.
name: SPA — генерируемые документы не разошлись с замером

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generated-docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Реестр зрелости совпадает с замером
        run: python3 scripts/build_maturity_register.py --check
      - name: Паспорта агентов не отстали от источников
        run: python3 scripts/fill_agent_passports.py --check
