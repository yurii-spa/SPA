<style>
/* Studio OS Shell — design system. Dark, premium, calm. Mobile-first.
   Tokens adapted from spa_director_os_prototype_v2 visual language. */
:root {
  --bg: #0a0d14;
  --bg-1: #0e1220;
  --panel: #141a2b;
  --panel-2: #1a2236;
  --line: #26304a;
  --line-soft: #1c2438;
  --ink: #e8edf7;
  --ink-2: #9aa7c2;
  --ink-3: #64708c;
  --brand: #6ea8fe;
  --brand-2: #8f7bff;
  --green: #3ecf8e;
  --yellow: #f2c14e;
  --red: #ff6b6b;
  --cyan: #4fd1c5;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 10px 40px rgba(0,0,0,.45);
  --shadow-soft: 0 2px 14px rgba(0,0,0,.3);
  --grad-brand: linear-gradient(135deg, var(--brand), var(--brand-2));
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --tap: 44px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(1200px 700px at 80% -10%, #16203a 0%, var(--bg) 55%) fixed;
  color: var(--ink); font-family: var(--font);
  -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45;
}
a { color: var(--brand); text-decoration: none; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82em; color: var(--ink-2); }

/* ---- App frame ---- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; align-self: start; height: 100vh;
  background: linear-gradient(180deg, var(--bg-1), var(--bg));
  border-right: 1px solid var(--line-soft); padding: 18px 14px; display: flex; flex-direction: column; gap: 6px;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 6px 8px 16px; }
.brand .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--grad-brand);
  box-shadow: 0 6px 18px rgba(110,168,254,.35); flex: none; position: relative; }
.brand .logo::after { content: ""; position: absolute; inset: 8px; border-radius: 5px;
  background: rgba(10,13,20,.55); }
.brand .name { font-weight: 700; letter-spacing: .2px; }
.brand .sub { font-size: 11px; color: var(--ink-3); }
.modeswitch { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line-soft);
  border-radius: 12px; padding: 4px; margin-bottom: 10px; }
.modeswitch button { flex: 1; border: 0; background: transparent; color: var(--ink-2); font-weight: 600;
  padding: 9px 6px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.modeswitch button.active { background: var(--grad-brand); color: #08101f; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  background: transparent; border: 0; color: var(--ink-2); padding: 11px 12px; border-radius: 10px;
  cursor: pointer; font-size: 14px; font-weight: 500; min-height: var(--tap); }
.nav button .ico { width: 18px; text-align: center; opacity: .9; }
.nav button:hover { background: var(--panel); color: var(--ink); }
.nav button.active { background: var(--panel-2); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
.nav .badge { margin-left: auto; background: var(--red); color: #1b0808; border-radius: 999px;
  font-size: 11px; font-weight: 700; padding: 1px 7px; }
.sidebar .spacer { flex: 1; }
.langbtn { background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); border-radius: 10px;
  padding: 9px; cursor: pointer; font-weight: 700; min-height: var(--tap); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbanner { font-size: 12px; color: var(--ink-3); padding: 8px 22px; border-bottom: 1px solid var(--line-soft);
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: rgba(0,0,0,.15); }
.topbanner .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.topbanner.closed .dot { background: var(--yellow); }
.content { padding: 22px; max-width: 1180px; width: 100%; }
h1.page { font-size: 22px; margin: 2px 0 4px; }
.page-sub { color: var(--ink-3); font-size: 13px; margin-bottom: 18px; }

/* ---- Cards & grid ---- */
.grid { display: grid; gap: 14px; }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card { background: linear-gradient(180deg, var(--panel), var(--bg-1)); border: 1px solid var(--line-soft);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-soft); }
.card h3 { margin: 0 0 12px; font-size: 13px; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.kpi .v { font-size: 30px; font-weight: 750; letter-spacing: -.5px; }
.kpi .l { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.kpi.accent .v { color: var(--brand); }
.kpi.warn .v { color: var(--yellow); }
.kpi.bad .v { color: var(--red); }
.kpi.good .v { color: var(--green); }

/* ---- Status + risk ---- */
.badge-s { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.badge-s::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-running { color: var(--brand); border-color: rgba(110,168,254,.4); background: rgba(110,168,254,.08); }
.s-owner_wait { color: var(--yellow); border-color: rgba(242,193,78,.4); background: rgba(242,193,78,.08); }
.s-blocked { color: #ff9f6b; border-color: rgba(255,159,107,.4); background: rgba(255,159,107,.08); }
.s-failed { color: var(--red); border-color: rgba(255,107,107,.4); background: rgba(255,107,107,.08); }
.s-done { color: var(--green); border-color: rgba(62,207,142,.35); background: rgba(62,207,142,.07); }
.s-review { color: var(--cyan); border-color: rgba(79,209,197,.4); background: rgba(79,209,197,.08); }
.s-queued, .s-planned { color: var(--ink-2); }
.zone-pill { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
.z-green { background: rgba(62,207,142,.15); color: var(--green); }
.z-yellow { background: rgba(242,193,78,.15); color: var(--yellow); }
.z-red { background: rgba(255,107,107,.15); color: var(--red); }
.fresh { font-size: 11px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-3); }
.fresh.LIVE { color: var(--green); border-color: rgba(62,207,142,.35); }
.fresh.RECENT { color: var(--cyan); border-color: rgba(79,209,197,.3); }
.fresh.STALE { color: var(--yellow); border-color: rgba(242,193,78,.35); }
.fresh.UNKNOWN { color: var(--ink-3); }

/* ---- Work board ---- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filters button { background: var(--panel); border: 1px solid var(--line-soft); color: var(--ink-2);
  border-radius: 999px; padding: 7px 13px; cursor: pointer; font-size: 13px; min-height: 38px; }
.filters button.active { background: var(--panel-2); color: var(--ink); border-color: var(--line); }
.tasklist { display: flex; flex-direction: column; gap: 10px; }
.task { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
  padding: 13px 15px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: border-color .15s, transform .1s; }
.task:hover { border-color: var(--line); transform: translateY(-1px); }
.task .tid { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink-3); flex: none; }
.task .ttitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.task .tright { display: flex; gap: 8px; align-items: center; flex: none; }
.empty { color: var(--ink-3); text-align: center; padding: 40px 10px; border: 1px dashed var(--line-soft); border-radius: var(--radius); }

/* rows */
.row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.row:last-child { border-bottom: 0; }
.row .k { color: var(--ink-3); font-size: 13px; }
.row .val { text-align: right; }
.list-clean { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.activity li { display: flex; gap: 10px; font-size: 13px; color: var(--ink-2); padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
.activity li .t { color: var(--ink-3); font-family: ui-monospace, Menlo, monospace; font-size: 11px; flex: none; }
.note { font-size: 12px; color: var(--ink-3); margin-top: 10px; line-height: 1.5; }

/* ---- Drawer (task detail) ---- */
.scrim { position: fixed; inset: 0; background: rgba(3,6,12,.62); backdrop-filter: blur(3px); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(520px, 94vw); background: var(--bg-1);
  border-left: 1px solid var(--line); z-index: 41; transform: translateX(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  box-shadow: var(--shadow); display: flex; flex-direction: column; }
.drawer.open { transform: translateX(0); }
.drawer .dh { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
.drawer .dh .x { margin-left: auto; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2);
  border-radius: 9px; width: 40px; height: 40px; cursor: pointer; font-size: 18px; }
.drawer .db { padding: 18px; overflow: auto; }

/* ---- Studio View ---- */
.studio-wrap { padding: 16px 22px 28px; }
.studio-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.studio-head .legend { color: var(--ink-3); font-size: 12px; max-width: 640px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.stage { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.zone { position: relative; min-height: 172px; border-radius: var(--radius); padding: 12px;
  background: radial-gradient(120% 100% at 50% 0%, var(--panel-2), var(--bg-1)); border: 1px solid var(--line-soft); overflow: hidden; }
.zone::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(0,0,0,.25)); pointer-events: none; }
.zone.z-owner { border-color: rgba(242,193,78,.35); box-shadow: inset 0 0 40px rgba(242,193,78,.06); }
.zone.z-blocked { border-color: rgba(255,159,107,.3); }
.zone.z-reliability { border-color: rgba(255,107,107,.25); }
.zone .zh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; position: relative; z-index: 1; }
.zone .zh .zn { font-size: 12px; font-weight: 700; letter-spacing: .3px; color: var(--ink); }
.zone .zh .zc { font-size: 11px; color: var(--ink-3); background: rgba(0,0,0,.3); border-radius: 6px; padding: 1px 7px; }
.agents { display: flex; flex-wrap: wrap; gap: 8px; position: relative; z-index: 1; }
.agent { display: flex; align-items: center; gap: 7px; background: rgba(10,14,24,.7); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px 5px 6px; cursor: pointer; font-size: 12px; color: var(--ink);
  animation: pop .4s ease; transition: transform .2s, box-shadow .2s; }
.agent:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
.agent .av { width: 22px; height: 22px; border-radius: 50%; background: var(--grad-brand); flex: none; position: relative; }
.agent .av.running { animation: pulse 1.8s ease-in-out infinite; }
.agent.st-owner_wait .av { background: linear-gradient(135deg, var(--yellow), #d99a2b); }
.agent.st-blocked .av { background: linear-gradient(135deg, #ff9f6b, #e0663a); }
.agent.st-failed .av { background: linear-gradient(135deg, var(--red), #b23b3b); }
.agent.st-done .av { background: linear-gradient(135deg, var(--green), #2a9d6a); }
.agent.st-review .av { background: linear-gradient(135deg, var(--cyan), #2f9e94); }
.agent .an { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zone .empty-z { color: var(--ink-3); font-size: 12px; opacity: .6; position: relative; z-index: 1; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(110,168,254,.5); } 50% { box-shadow: 0 0 0 6px rgba(110,168,254,0); } }
body.reduce-motion .agent { animation: none; }
body.reduce-motion .agent .av.running { animation: none; }
body.reduce-motion * { transition: none !important; }

/* ---- Mobile ---- */
.mobitop { display: none; }
.bottomnav { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .mobitop { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    position: sticky; top: 0; z-index: 20; background: rgba(10,13,20,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-soft); }
  .mobitop .name { font-weight: 700; }
  .mobitop .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--grad-brand); flex: none; }
  .mobitop .modeswitch { margin: 0 0 0 auto; width: auto; }
  .mobitop .modeswitch button { padding: 7px 10px; font-size: 12px; }
  .mobitop .langbtn { padding: 7px 10px; min-height: 38px; }
  .content { padding: 16px 14px 90px; }
  .studio-wrap { padding: 12px 14px 90px; }
  .stage { grid-template-columns: 1fr; }
  .bottomnav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: rgba(12,16,26,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); justify-content: space-around; }
  .bottomnav button { flex: 1; background: transparent; border: 0; color: var(--ink-3); font-size: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; min-height: var(--tap); cursor: pointer; }
  .bottomnav button .ico { font-size: 17px; }
  .bottomnav button.active { color: var(--brand); }
  .bottomnav .badge { position: absolute; top: 2px; margin-left: 16px; background: var(--red); color: #1b0808;
    border-radius: 999px; font-size: 9px; font-weight: 700; padding: 0 5px; }
  h1.page { font-size: 19px; }
  .drawer { width: 100vw; }
}
@media (min-width: 861px) { .mobitop { display: none; } }

</style>

  return el('span', { class: 'fresh ' + (f.freshness || 'UNKNOWN'), title: f.updated_at || '' }, lab);
}
function statusBadge(t, ui) { return el('span', { class: 'badge-s s-' + ui }, t('status.' + ui, ui)); }
function zonePill(zone) {
  if (!zone) return null;
  const cls = zone === 'red' ? 'z-red' : zone === 'yellow' ? 'z-yellow' : zone === 'green' ? 'z-green' : 'z-yellow';
  return el('span', { class: 'zone-pill ' + cls }, zone);
}

// ---------------- Mission Control pages ----------------
function pageOverview(t, m) {
  const ov = m.overview || {}; const c = ov.counts || {};
  const wrap = el('div', {});
  wrap.append(el('h1', { class: 'page' }, t('overview.title')));
  wrap.append(el('div', { class: 'page-sub' }, m.generated_at ? t('common.updated') + ': ' + fmtTime(m.generated_at) : ''));
  const kpi = el('div', { class: 'grid g-kpi' });
  const cards = [
    ['owner', ov.owner_waiting || 0, 'warn'],
    ['running', c.running || 0, 'accent'],
    ['blocked', c.blocked || 0, ov.blocked ? 'warn' : ''],
    ['failed', c.failed || 0, ov.failed ? 'bad' : ''],
    ['done', c.done || 0, 'good'],
    ['missions', ov.missions_total || 0, ''],
  ];
  for (const [key, val, cls] of cards) {
    kpi.append(el('div', { class: 'card kpi ' + cls }, el('div', { class: 'v' }, String(val)),
      el('div', { class: 'l' }, t('overview.' + key))));
  }
  wrap.append(kpi);

  const two = el('div', { class: 'grid g-2', style: 'margin-top:14px' });
  // dispatch + golive
  const sys = m.system || {}; const disp = sys.dispatch || {};
  const c1 = el('div', { class: 'card' }, el('h3', {}, t('overview.dispatch')));
  c1.append(row(t('overview.dispatch'), el('span', { class: 'badge-s ' + (disp.open ? 's-running' : 's-owner_wait') },
    disp.open ? t('overview.dispatch.open') : t('overview.dispatch.closed'))));
  if (!disp.open && disp.reason) c1.append(el('div', { class: 'note' }, '⚠︎ ' + disp.reason));
  const gl = sys.golive;
  if (gl) {
    c1.append(row(t('overview.golive'), el('span', {}, (gl.passed ?? '—') + ' / ' + (gl.total ?? '—'))));
    c1.append(row(t('system.trackDays'), el('span', {}, String(gl.real_track_days ?? t('common.unknown')))));
    if (gl.freshness) c1.append(row(t('common.updated'), fresh(t, gl.freshness)));
  }
  two.append(c1);
  // activity
  const c2 = el('div', { class: 'card' }, el('h3', {}, t('overview.activity')));
  const acts = (m.activity || []);
  if (!acts.length) c2.append(el('div', { class: 'note' }, t('overview.emptyActivity')));
  else {
    const ul = el('ul', { class: 'list-clean activity' });
    for (const a of acts.slice(0, 8)) ul.append(el('li', {}, el('span', { class: 't' }, shortTime(a.ts)), el('span', {}, a.text)));
    c2.append(ul);
  }
  two.append(c2);
  wrap.append(two);
  return wrap;
}

function pageWork(t, m) {
  const wrap = el('div', {});
  wrap.append(el('h1', { class: 'page' }, t('work.title')));
  const work = m.work || [];
  const counts = {}; for (const w of work) counts[w.ui_state] = (counts[w.ui_state] || 0) + 1;
  const filters = el('div', { class: 'filters' });
  const mk = (key, label) => {
    const b = el('button', { class: STATE.workFilter === key || (!STATE.workFilter && key === 'all') ? 'active' : '',
      onclick: () => { STATE.workFilter = key; render(); } }, label + (key !== 'all' && counts[key] ? ' · ' + counts[key] : ''));
    return b;
  };
  filters.append(mk('all', t('work.filter.all') + ' · ' + work.length));
  for (const s of STATUS_ORDER) if (counts[s]) filters.append(mk(s, t('status.' + s)));
  wrap.append(filters);
  const list = el('div', { class: 'tasklist' });
  const shown = work.filter(w => !STATE.workFilter || STATE.workFilter === 'all' || w.ui_state === STATE.workFilter)
    .sort((a, b) => STATUS_ORDER.indexOf(a.ui_state) - STATUS_ORDER.indexOf(b.ui_state));
  if (!shown.length) list.append(el('div', { class: 'empty' }, t('work.empty')));
  for (const w of shown) {
    list.append(el('div', { class: 'task', onclick: () => openTask(w) },
      el('span', { class: 'tid' }, (w.work_item_id || '').replace('wi-', '').slice(0, 8)),
      el('span', { class: 'ttitle' }, w.title || w.id),
      el('span', { class: 'tright' }, w.permission_zone ? zonePill(w.permission_zone) : null, statusBadge(t, w.ui_state))));
  }
  wrap.append(list);
  return wrap;
}

function pageDecisions(t, m) {
  const wrap = el('div', {});
  wrap.append(el('h1', { class: 'page' }, t('decisions.title')));
  const d = (m.decisions && m.decisions.items) || [];
  if (!d.length) { wrap.append(el('div', { class: 'empty' }, t('decisions.empty'))); return wrap; }
  const list = el('div', { class: 'tasklist' });
  for (const it of d) {
    const card = el('div', { class: 'card' });
    card.append(el('div', { style: 'display:flex;gap:10px;align-items:flex-start' },
      zonePill('red'), el('div', { style: 'flex:1;font-weight:600' }, it.title)));
    card.append(el('div', { class: 'note' }, t('decisions.needsOwner')));
    if (it.card) card.append(el('div', { class: 'mono', style: 'margin-top:6px' }, t('decisions.card') + ': ' + it.card + '.md'));
    list.append(card);
  }
  wrap.append(list);
  wrap.append(el('div', { class: 'note', style: 'margin-top:14px' }, t('decisions.note')));
  return wrap;
}

function pageAgents(t, m) {
  const wrap = el('div', {}); wrap.append(el('h1', { class: 'page' }, t('agents.title')));
  const roles = (m.roles && m.roles.ai_roles) || [];
  const c = el('div', { class: 'card' }, el('h3', {}, t('agents.aiRoles')));
  for (const r of roles) {
    const writes = r.writes === false ? t('agents.writesNo') : (typeof r.writes === 'string' ? t('agents.writesIsolated') : String(r.writes));
    c.append(el('div', { class: 'row' }, el('span', { class: 'k' }, r.role),
      el('span', { class: 'val' }, el('span', { class: 'badge-s ' + (r.writes === false ? 's-done' : 's-owner_wait') }, writes),
        r.tools ? el('span', { class: 'mono', style: 'margin-left:8px' }, r.tools.join(', ')) : null)));
  }
  wrap.append(c);
  const fleet = m.roles && m.roles.fleet;
  if (fleet) {
    const f = el('div', { class: 'card', style: 'margin-top:14px' }, el('h3', {}, t('agents.fleet')));
    f.append(row(t('agents.loaded'), el('span', {}, (fleet.total_loaded ?? '—') + ' / ' + (fleet.total_known ?? '—'))));
    f.append(row(t('agents.problems'), el('span', {}, String(fleet.problem_count ?? t('common.unknown')))));
    if (fleet.freshness) f.append(row(t('common.updated'), fresh(t, fleet.freshness)));
    f.append(el('div', { class: 'note' }, t('agents.fleetNote')));
    wrap.append(f);
  }
  return wrap;
}

function pageSystem(t, m) {
  const wrap = el('div', {}); wrap.append(el('h1', { class: 'page' }, t('system.title')));
  const sys = m.system || {};
  const two = el('div', { class: 'grid g-2' });
  // dispatch
  const cd = el('div', { class: 'card' }, el('h3', {}, t('system.dispatch')));
  cd.append(row(t('overview.dispatch'), el('span', { class: 'badge-s ' + (sys.dispatch?.open ? 's-running' : 's-owner_wait') },
    sys.dispatch?.open ? t('overview.dispatch.open') : t('overview.dispatch.closed'))));
  if (sys.dispatch?.reason) cd.append(el('div', { class: 'note' }, sys.dispatch.reason));
  two.append(cd);
  // provider + candidate
  for (const [k, plane] of [['system.provider', sys.provider_plane], ['system.candidate', sys.candidate_plane]]) {
    if (!plane) continue;
    const c = el('div', { class: 'card' }, el('h3', {}, t(k)));
    const fa = plane.last_activity;
    c.append(row(t('system.lastActivity'), fa ? fresh(t, fa) : el('span', {}, t('common.unknown'))));
    c.append(el('div', { class: 'note' }, plane.note || t('system.privNote')));
    two.append(c);
  }
  // golive
  if (sys.golive) {
    const g = el('div', { class: 'card' }, el('h3', {}, t('system.golive')));
    g.append(row('ready', el('span', { class: 'badge-s ' + (sys.golive.ready ? 's-done' : 's-owner_wait') }, String(sys.golive.ready))));
    g.append(row(t('system.golive'), el('span', {}, (sys.golive.passed ?? '—') + ' / ' + (sys.golive.total ?? '—'))));
    (sys.golive.blockers || []).forEach(b => g.append(el('div', { class: 'note' }, '• ' + b)));
    two.append(g);
  }
  // health + capacity
  const h = el('div', { class: 'card' }, el('h3', {}, t('system.health')));
  const ra = sys.health?.risk_alerts;
  if (ra) { h.append(row(t('system.riskAlerts'), el('span', {}, String(ra.count ?? t('common.unknown'))))); if (ra.freshness) h.append(row(t('common.updated'), fresh(t, ra.freshness))); }
  const ah = sys.health?.agents;
  if (ah) h.append(row(t('system.health'), el('span', {}, `${ah.overall ?? '?'} (${ah.healthy ?? 0}/${ah.total ?? 0})`)));
  const cap = m.capacity;
  if (cap && cap.subscription_plan) {
    h.append(row(t('system.plan'), el('span', {}, cap.subscription_plan)));
    h.append(row(t('system.costCycle'), el('span', {}, cap.cost_per_cycle_usd != null ? '$' + cap.cost_per_cycle_usd : t('common.unknown'))));
  }
  two.append(h);
  wrap.append(two);
  return wrap;
}

// ---------------- Studio View ----------------
function studioView(t, m) {
  const wrap = el('div', { class: 'studio-wrap' });
  const head = el('div', { class: 'studio-head' },
    el('h1', { class: 'page', style: 'margin:0' }, t('studio.title')),
    el('label', { class: 'toggle' },
      (() => { const cb = el('input', { type: 'checkbox' }); cb.checked = STATE.reduceMotion;
        cb.addEventListener('change', () => { STATE.reduceMotion = cb.checked; localStorage.setItem('sos.rm', cb.checked ? '1' : '0'); applyMotion(); }); return cb; })(),
      t('studio.reduceMotion')));
  wrap.append(head);
  wrap.append(el('div', { class: 'studio-head' }, el('div', { class: 'legend' }, t('studio.legend'))));
  const work = m.work || [];
  const byZone = {}; ZONES.forEach(z => byZone[z] = []);
  for (const w of work) { const z = w.zone && byZone[w.zone] ? w.zone : 'intake'; byZone[z].push(w); }
  // owner zone also gets decisions
  const dec = (m.decisions && m.decisions.items) || [];
  const stage = el('div', { class: 'stage' });
  for (const z of ZONES) {
    const items = byZone[z];
    const extra = z === 'owner' ? dec.length : 0;
    const zc = el('div', { class: 'zone z-' + z });
    zc.append(el('div', { class: 'zh' }, el('span', { class: 'zn' }, t('studio.zone.' + z)),
      el('span', { class: 'zc' }, String(items.length + extra))));
    const ag = el('div', { class: 'agents' });
    for (const w of items) {
      ag.append(el('div', { class: 'agent st-' + w.ui_state, onclick: () => openTask(w) },
        el('span', { class: 'av ' + (w.ui_state === 'running' ? 'running' : '') }),
        el('span', { class: 'an' }, w.title || w.work_item_id)));
    }
    if (z === 'owner') for (const d of dec) ag.append(el('div', { class: 'agent st-owner_wait' },
      el('span', { class: 'av' }), el('span', { class: 'an' }, d.title)));
    if (!items.length && !extra) ag.append(el('div', { class: 'empty-z' }, t('studio.empty')));
    zc.append(ag); stage.append(zc);
  }
  wrap.append(stage);
  return wrap;
}

// ---------------- Task drawer (shared entity across modes) ----------------
function openTask(w) {
  const t = STATE.t;
  const scrim = document.getElementById('scrim');
  const dr = document.getElementById('drawer');
  const body = dr.querySelector('.db');
  dr.querySelector('.dtitle').textContent = w.title || w.work_item_id;
  body.innerHTML = '';
  const add = (k, v) => body.append(row(k, typeof v === 'string' || typeof v === 'number' ? el('span', {}, String(v)) : v));
  body.append(el('div', { class: 'mono', style: 'margin-bottom:10px' }, w.work_item_id));
  add(t('task.state'), statusBadge(t, w.ui_state));
  add(t('task.backendState'), el('span', { class: 'mono' }, w.state || t('common.unknown')));
  if (w.permission_zone) add(t('common.zone'), zonePill(w.permission_zone));
  add(t('task.zone'), t('studio.zone.' + w.zone, w.zone));
  if (w.mission_id) add(t('task.mission'), el('span', { class: 'mono' }, w.mission_id));
  if (w.reason_code) add(t('task.reason'), w.reason_code);
  if (w.request_summary) add(t('task.request'), w.request_summary);
  if (w.created_at) add(t('task.created'), fmtTime(w.created_at));
  if (w.history_len != null) add(t('task.history'), String(w.history_len));
  if (w.attempt != null) add(t('common.attempt'), String(w.attempt));
  if (w.source) body.append(el('div', { class: 'note', style: 'margin-top:12px' }, t('task.provenance') + ': ' + w.source));
  scrim.classList.add('open'); dr.classList.add('open');
}
function closeDrawer() { document.getElementById('scrim').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }

// ---------------- helpers ----------------
function row(k, valNode) { return el('div', { class: 'row' }, el('span', { class: 'k' }, k), el('span', { class: 'val' }, valNode)); }
function fmtTime(s) { try { return new Date(s).toLocaleString(STATE.lang === 'ru' ? 'ru-RU' : 'en-US'); } catch { return s; } }
function shortTime(s) { if (!s) return '—'; try { return new Date(s).toLocaleTimeString(STATE.lang === 'ru' ? 'ru-RU' : 'en-US', { hour: '2-digit', minute: '2-digit' }); } catch { return ''; } }
function applyMotion() { document.body.classList.toggle('reduce-motion', STATE.reduceMotion); }

// ---------------- render ----------------
function render() {
  const t = STATE.t = makeT(STATE.lang);
  const m = STATE.model || {};
  const app = document.getElementById('app');
  app.innerHTML = '';
  const decCount = (m.decisions && m.decisions.items && m.decisions.items.length) || 0;

  // sidebar (desktop)
  const side = el('aside', { class: 'sidebar' });
  side.append(el('div', { class: 'brand' }, el('div', { class: 'logo' }),
    el('div', {}, el('div', { class: 'name' }, t('app.title')), el('div', { class: 'sub' }, t('app.subtitle')))));
  side.append(modeSwitch(t));
  const nav = el('nav', { class: 'nav' });
  for (const [key, ico] of NAV) {
    const b = el('button', { class: STATE.mode === 'mission' && STATE.page === key ? 'active' : '',
      onclick: () => { STATE.mode = 'mission'; STATE.page = key; persist(); render(); } },
      el('span', { class: 'ico' }, ico), el('span', {}, t('nav.' + key)));
    if (key === 'decisions' && decCount) b.append(el('span', { class: 'badge' }, String(decCount)));
    nav.append(b);
  }
  const sb = el('button', { class: STATE.mode === 'studio' ? 'active' : '',
    onclick: () => { STATE.mode = 'studio'; persist(); render(); } }, el('span', { class: 'ico' }, '◊'), el('span', {}, t('nav.studio')));
  nav.append(sb);
  side.append(nav);
  side.append(el('div', { class: 'spacer' }));
  side.append(el('button', { class: 'langbtn', onclick: toggleLang }, t('lang.switch')));
  app.append(side);

  // main
  const main = el('div', { class: 'main' });
  main.append(mobitop(t, decCount));
  const disp = m.system && m.system.dispatch;
  const banner = el('div', { class: 'topbanner' + (disp && !disp.open ? ' closed' : '') },
    el('span', { class: 'dot' }), el('span', {}, t('banner.readonly')));
  if (disp && !disp.open) banner.append(el('span', {}, '· ' + t('banner.dispatchClosed')));
  main.append(banner);

  let view;
  if (m.__error) view = el('div', { class: 'content' }, el('div', { class: 'empty' }, t('common.notAvailable') + ': read_model.json — ' + m.__error));
  else if (STATE.mode === 'studio') view = studioView(t, m);
  else {
    const content = el('div', { class: 'content' });
    const pages = { overview: pageOverview, work: pageWork, decisions: pageDecisions, agents: pageAgents, system: pageSystem };
    content.append((pages[STATE.page] || pageOverview)(t, m));
    view = content;
  }
  main.append(view);
  main.append(bottomnav(t, decCount));
  app.append(main);
  applyMotion();
}

function modeSwitch(t) {
  return el('div', { class: 'modeswitch' },
    el('button', { class: STATE.mode === 'mission' ? 'active' : '', onclick: () => { STATE.mode = 'mission'; persist(); render(); } }, t('mode.mission')),
    el('button', { class: STATE.mode === 'studio' ? 'active' : '', onclick: () => { STATE.mode = 'studio'; persist(); render(); } }, t('mode.studio')));
}
function mobitop(t, decCount) {
  return el('div', { class: 'mobitop' }, el('div', { class: 'logo' }), el('div', { class: 'name' }, t('app.title')),
    modeSwitch(t), el('button', { class: 'langbtn', onclick: toggleLang }, t('lang.switch')));
}
function bottomnav(t, decCount) {
  const bn = el('div', { class: 'bottomnav' });
  for (const [key, ico] of NAV) {
    const b = el('button', { class: STATE.mode === 'mission' && STATE.page === key ? 'active' : '',
      onclick: () => { STATE.mode = 'mission'; STATE.page = key; persist(); render(); } },
      el('span', { class: 'ico' }, ico), el('span', {}, t('nav.' + key)));
    if (key === 'decisions' && decCount) b.append(el('span', { class: 'badge' }, String(decCount)));
    bn.append(b);
  }
  bn.append(el('button', { class: STATE.mode === 'studio' ? 'active' : '', onclick: () => { STATE.mode = 'studio'; persist(); render(); } },
    el('span', { class: 'ico' }, '◊'), el('span', {}, t('nav.studio'))));
  return bn;
}
function toggleLang() { STATE.lang = STATE.lang === 'ru' ? 'en' : 'ru'; localStorage.setItem('sos.lang', STATE.lang); document.documentElement.lang = STATE.lang; render(); }
function persist() { localStorage.setItem('sos.mode', STATE.mode); }

async function boot() {
  document.documentElement.lang = STATE.lang;
  document.getElementById('scrim').addEventListener('click', closeDrawer);
  document.getElementById('drawer').querySelector('.x').addEventListener('click', closeDrawer);
  await loadModel();
  render();
  // gentle refresh of the read model view every 30s (read-only)
  setInterval(async () => { await loadModel(); render(); }, 30000);
}
boot();
</script>
</body>
</html>
