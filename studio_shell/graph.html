<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#06080e"/>
<title>Earn DeFi — Visual OS</title>
<style>
  :root{--bg:#06080e;--bg2:#0a0e18;--ink:#c8d2e8;--ink2:#8792ab;--ink3:#5a6480;--line:#182031;--line2:#212c42;
    --surf:rgba(12,16,26,.82);--accent:#7aa2d8;--accent-soft:rgba(122,162,216,.1);--accent-line:rgba(122,162,216,.4);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--ease:cubic-bezier(.32,.72,0,1);--sb:232px;--tb:52px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overflow-x:hidden;max-width:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased;font-size:14px}
  /* WHY mobile vertical trace */
  .whym{padding:14px 14px 80px;max-width:100%} .whym-stage{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 auto;max-width:520px}
  .whym-h{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
  .whym-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(24,32,49,.6);font-size:12.5px} .whym-row:first-of-type{border-top:0}
  .whym-mk{width:12px;height:12px;flex:none;border:1.6px solid #7aa2d8} .whym-mk.hx{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)} .whym-mk.sq{border-radius:2px} .whym-mk.di{transform:rotate(45deg)} .whym-mk.ci{border-radius:50%}
  .whym-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .whym-st{font-size:9px;letter-spacing:.08em;text-transform:uppercase;flex:none}
  .whym-arrow{text-align:center;color:var(--ink3);font-size:14px;line-height:1.4;margin:2px auto;max-width:520px}
  .whym-llm{display:flex;align-items:center;gap:9px;max-width:520px;margin:10px auto 0;padding:9px 12px;border:1px dashed rgba(143,123,255,.4);border-radius:10px;color:#a99cf0;font-size:10.5px;letter-spacing:.08em}
  button{font-family:var(--mono);cursor:pointer}
  /* ── OS shell ── */
  .osshell{position:fixed;inset:0;display:flex}
  .sidebar{width:var(--sb);flex:none;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;z-index:20}
  .sb-head{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
  .sb-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8f7bff);flex:none;position:relative}
  .sb-logo::after{content:"";position:absolute;inset:7px;border-radius:4px;background:rgba(8,11,18,.6)}
  .sb-name{font-size:13px;font-weight:700;letter-spacing:.14em} .sb-sub{margin-top:3px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
  .nav{flex:1;overflow-y:auto;padding:2px 10px 10px;display:flex;flex-direction:column;gap:1px}
  .nav-grp{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);padding:14px 10px 6px;border-top:1px solid var(--line);margin-top:6px}
  .nav-grp:first-child{border-top:0;margin-top:0}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;
    color:var(--ink2);font-size:13px;font-weight:500;padding:7px 10px;transition:transform .12s var(--ease),color .12s,background .12s}
  .nav-item .ni{width:15px;text-align:center;opacity:.85;font-size:13px}
  .nav-item:hover{color:var(--ink);transform:translateX(2px)}
  .nav-item.on{border-color:var(--accent-line);background:var(--accent-soft);color:#dfe8f7}
  .nav-item .nb{margin-left:auto;font-size:10px;font-weight:700;color:#08101f;background:var(--accent);border-radius:999px;padding:0 6px}
  .nav-item.on .nb,.nav-item .nb.warn{background:#d6a94a}
  .sb-foot{border-top:1px solid var(--line);padding:13px 18px;font-size:10px;color:var(--ink3);display:flex;flex-direction:column;gap:4px}
  .sb-foot .st{display:flex;align-items:center;gap:7px;color:var(--ink2)} .sb-foot .dot{width:7px;height:7px;border-radius:50%;background:#5aa17a;animation:pdot 2s ease-in-out infinite}
  body.rm .dot{animation:none} @keyframes pdot{0%,100%{opacity:1}50%{opacity:.35}}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:var(--tb);flex:none;border-bottom:1px solid var(--line);background:rgba(10,14,24,.7);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:0 20px}
  .crumb{font-size:11px;letter-spacing:.04em;color:var(--ink3)} .crumb b{color:var(--ink);font-weight:500}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:9px}
  .rochip{font-size:9.5px;letter-spacing:.14em;color:#5fb8ac;border:1px solid rgba(95,184,172,.4);border-radius:999px;padding:5px 11px}
  .tb-btn{height:30px;min-width:30px;display:grid;place-items:center;padding:0 10px;color:var(--ink2);background:rgba(12,16,26,.7);border:1px solid var(--line);border-radius:8px;font-size:11px;letter-spacing:.06em}
  .tb-btn:hover{color:var(--ink)} .kbd{font-size:9px;color:var(--ink3);margin-left:6px}
  .content{flex:1;min-height:0;position:relative}
  /* stages */
  #stage,#whystage,#homeview,#decisionsview,#capitalview,#strategiesview,#voiceview,#sliceview,#compareview,#projectsview,#memoryview,#workview,#researchview{position:absolute;inset:0} #whystage,#homeview,#decisionsview,#capitalview,#strategiesview,#voiceview,#sliceview,#compareview,#projectsview,#memoryview,#workview,#researchview{display:none}

  body.view-capital #capitalview,body.view-strategies #strategiesview,body.view-voice #voiceview,body.view-slice #sliceview,body.view-slicep #sliceview,body.view-compare #compareview,body.view-projects #projectsview,body.view-memory #memoryview,body.view-work #workview,body.view-research #researchview{display:block;overflow:auto}

  .subbar .sb-right{margin-left:auto;pointer-events:auto;display:flex;gap:8px}
  body.view-system .subbar,body.view-why .subbar,body.view-home .subbar,body.view-decisions .subbar,body.view-capital .subbar,body.view-strategies .subbar,body.view-voice .subbar,body.view-slice .subbar,body.view-slicep .subbar,body.view-compare .subbar,body.view-projects .subbar,body.view-memory .subbar{display:none}
  body.view-slice #directory,body.view-slicep #directory,body.view-compare #directory,body.view-projects #directory,body.view-memory #directory,body.view-work #directory,body.view-research #directory{display:none}
  body.view-work .subbar,body.view-research .subbar{display:none}
  body.view-work .panel{right:28px}   /* closed-panel translateX(24px) must not exceed the viewport */
  /* directory + inspector (reused) */
  #directory{position:absolute;top:56px;right:16px;z-index:5;width:206px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;backdrop-filter:blur(10px)}
  body.view-system #directory,body.view-why #directory,body.view-home #directory,body.view-decisions #directory,body.view-capital #directory,body.view-strategies #directory,body.view-voice #directory{display:none}
  .dhead{font-size:9.5px;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin-bottom:8px}
  .drow{display:flex;align-items:center;gap:9px;padding:5px 4px;border-radius:7px;cursor:pointer;font-size:11.5px;color:var(--ink2)} .drow:hover{background:var(--accent-soft);color:var(--ink)}
  .dmark{width:8px;height:8px;border-radius:2px;flex:none;transform:rotate(45deg)} .dnm{flex:1;letter-spacing:.03em} .dct{color:var(--ink3);font-size:10.5px}

  .panel{top:56px;right:238px;width:286px;border-radius:12px;padding:15px;transform:translateX(24px);opacity:0;pointer-events:none;transition:all .3s var(--ease)}

  .ptitle{flex:1;min-width:0} .ptitle strong{display:block;font-size:14px;letter-spacing:.02em} .psub{font-size:9.5px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}
  .px{background:rgba(10,14,24,.7);border:1px solid var(--line);color:var(--ink2);border-radius:7px;width:26px;height:26px;font-size:14px;flex:none}
  .ptrack{margin-bottom:6px} .pill{font-size:10px;font-weight:700;letter-spacing:.12em;padding:3px 9px;border:1px solid;border-radius:999px}
  .psec{font-size:9px;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin:11px 0 3px;border-top:1px solid var(--line);padding-top:9px}
  .prow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:12px} .prow .pk{color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;font-size:10px} .prow .pv{text-align:right;color:var(--ink)} .prow .pv.warn{color:#d6a94a}
  .pacts{display:flex;gap:6px;margin-top:12px} .pact{flex:1;font-size:9.5px;letter-spacing:.1em;color:var(--ink2);background:rgba(10,14,24,.7);border:1px solid var(--line);border-radius:7px;padding:8px 4px}
  .prov{margin-top:11px;font-size:9.5px;color:var(--ink3);word-break:break-all;line-height:1.6}
  .sheet{left:0;right:0;bottom:0;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .32s var(--ease);max-height:72vh;overflow:auto}

  /* SYSTEM panels */

  .op-panel{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .op-head{font-size:9.5px;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .op-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12px;border-top:1px solid rgba(24,32,49,.6)} .op-row:first-of-type{border-top:0}
  .op-dot{width:7px;height:7px;border-radius:50%;flex:none} .op-lbl{flex:1;min-width:0;color:var(--ink2);letter-spacing:.03em;font-size:10.5px;text-transform:uppercase}
  .op-ct{color:var(--ink);font-size:12px;flex:none;text-align:right} .op-ct.warn{color:#d6a94a}
  .op-feed .op-pulse{width:7px;height:7px;border-radius:50%;background:#5aa17a;animation:pdot 1.8s ease-in-out infinite} .op-fct{margin-left:auto;color:var(--ink3);font-size:10px}
  .op-arow{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid rgba(24,32,49,.5);font-size:11px} .op-atime{color:var(--ink3);font-size:9.5px;flex:none} .op-atext{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .op-empty{color:var(--ink3);font-size:11px;padding:6px 0}
  /* HOME command center */
  .home{position:absolute;inset:0;overflow:auto;padding:22px 24px}
  .home-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:-.5px} .kpi .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
  .kpi.warn .v{color:#d6a94a} .kpi.bad .v{color:#d66a6a} .kpi.good .v{color:#5aa17a} .kpi.acc .v{color:var(--accent)}
  .home-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
  .card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h3{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);margin-bottom:11px;display:flex;align-items:center;gap:7px}
  .dec-card{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid rgba(24,32,49,.6);font-size:12.5px} .dec-card:first-of-type{border-top:0}
  .dec-pin{width:8px;height:8px;border-radius:50%;background:#d6a94a;margin-top:5px;flex:none} .dec-t{flex:1;line-height:1.4} .dec-m{font-size:10px;color:var(--ink3);margin-top:3px}
  #whybanner{display:none;position:absolute;top:12px;left:18px;z-index:6;font-size:10px;letter-spacing:.14em;color:#d6a94a;border:1px solid rgba(214,169,74,.4);background:rgba(214,169,74,.08);padding:6px 12px;border-radius:999px}
  body.view-why #whybanner{display:block}
  #whylegend{display:none;position:absolute;bottom:16px;right:20px;z-index:6;gap:14px;font-size:10px;color:var(--ink2)} body.view-why #whylegend{display:flex}
  #whylegend b{display:flex;align-items:center;gap:6px;font-weight:400} #whylegend i{width:11px;height:11px;display:inline-block} .wl-det{border:1.5px solid #d66a6a} .wl-llm{border:1.5px dashed #8f7bff} .wl-data{border:1.5px solid #7aa2d8;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
  #t-legend{position:absolute;left:18px;bottom:14px;z-index:5;font-size:10px;color:var(--ink3);max-width:46vw} body:not(.view-universe):not(.view-opportunities):not(.view-risk):not(.view-research) #t-legend{display:none}
  /* ── Owner Remote surfaces: CAPITAL · STRATEGIES · VOICE ── */
  .surf{position:absolute;inset:0;overflow:auto;padding:20px 22px calc(24px + env(safe-area-inset-bottom));max-width:820px}

  body.view-projects .surf,body.view-work .surf,body.view-research .surf,body.view-memory .surf{max-width:1280px}
  body.view-projects .pc-grid{grid-template-columns:1.05fr 1fr}

  .surf-h{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);margin:18px 0 10px;display:flex;align-items:center;gap:9px} .surf-h.sm{margin:14px 0 8px}

  .surf-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}

  .voice{max-width:640px} .voice-note{font-size:11px;color:var(--ink3);line-height:1.6;margin-bottom:14px}
